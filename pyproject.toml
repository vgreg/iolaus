[project]
name = "iolaus"
version = "0.1.1"
description = "Decorator-based CLI + config + logging framework for research projects."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vincent Grégoire", email = "vincent.gregoire@gmail.com" },
]
keywords = [
    "cli",
    "configuration",
    "logging",
    "research",
    "reproducibility",
    "data-analysis",
    "dynaconf",
    "typer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "dynaconf>=3.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "bump-my-version",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]",
]

[project.urls]
Homepage = "https://github.com/vgreg/iolaus"
Documentation = "https://www.vincentgregoire.com/iolaus/"
Repository = "https://github.com/vgreg/iolaus"
Issues = "https://github.com/vgreg/iolaus/issues"
Changelog = "https://github.com/vgreg/iolaus/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iolaus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["dynaconf", "dynaconf.*"]
ignore_missing_imports = true

[tool.bumpversion]
current_version = "0.1.1"
commit = true
tag = true
# uv.lock records the project's own version, so refresh and stage it as part of
# the bump commit instead of leaving it stale behind the pyproject version.
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/iolaus/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
